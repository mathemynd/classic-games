<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Games</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Game Selection Screen -->
    <div id="game-select" class="screen">
      <main>
        <h1>Classic Games</h1>
        <p class="subtitle">Choose your game</p>
        <div class="game-options">
          <button class="game-option" data-game="classic">
            <h2>Tic Tac Toe</h2>
            <p>Classic 3x3 grid. Get 3 in a row to win.</p>
          </button>
          <button class="game-option" data-game="ultimate">
            <h2>Ultimate Tic Tac Toe</h2>
            <p>9 boards in a board. Strategic masterpiece.</p>
          </button>
        </div>
      </main>
    </div>

    <!-- Classic Game Screen -->
    <div id="classic-screen" class="screen hide">
      <main>
        <h1>Play Tic Tac Toe</h1>
        <div>
          <p id="msg" class="hide"></p>
        </div>
        <div class="controls">
          <button id="new-game">New Game</button>
          <button id="reset-btn">Reset Game</button>
        </div>
        <div class="container">
          <div class="game" id="classic-board">
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
          </div>
        </div>
        <div class="controls" style="margin-top: 1rem;">
          <button id="back-btn">Change Game</button>
        </div>
      </main>
    </div>

    <!-- Ultimate Game Screen -->
    <div id="ultimate-screen" class="screen hide">
      <main>
        <h1>Ultimate Tic Tac Toe</h1>
        <div>
          <p id="ultimate-msg" class="hide"></p>
        </div>
        <div class="controls">
          <button id="ultimate-new-game">New Game</button>
          <button id="ultimate-reset-btn">Reset Game</button>
        </div>
        <div class="ultimate-info">
          <p id="active-board-info">Play anywhere to start</p>
        </div>
        <div class="container">
          <div class="ultimate-game" id="ultimate-board">
            <!-- Generated by JavaScript -->
          </div>
        </div>
        <div class="controls" style="margin-top: 1rem;">
          <button id="ultimate-back-btn">Change Game</button>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
